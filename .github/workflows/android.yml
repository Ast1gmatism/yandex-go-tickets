name: Android CI

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK (предустановленный + нужные пакеты)
        run: |
          export PATH="$PATH:$ANDROID_HOME/cmdline-tools/latest/bin"
          sdkmanager --version
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Тесты и сборка
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease --stacktrace

      - name: APK-артефакты
        uses: actions/upload-artifact@v4
        with:
          name: TrolleyTickets-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
